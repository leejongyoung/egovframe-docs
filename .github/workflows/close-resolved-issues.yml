name: Close resolved fork issues

on:
  schedule:
    - cron: '30 15 * * *'  # 매일 UTC 15:30 (sync-upstream-mirrors 직후, KST 00:30)
  workflow_dispatch:

jobs:
  close:
    if: github.repository == 'leejongyoung/egovframe-docs'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out close_resolved_issues.py
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/close_resolved_issues.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close issues whose upstream PRs merged and checklists are done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/close_resolved_issues.py

name: Sync fork main with upstream

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 UTC 15:00 (KST 00:00)
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'leejongyoung/egovframe-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/eGovFramework/egovframe-docs.git
          git fetch upstream main

      # main은 어떤 직접 커밋도 받지 않는 순수 미러이므로 fast-forward만 허용한다.
      # main에 수동 커밋이 생겨 fast-forward가 불가능해지면 여기서 실패해 알려준다.
      - name: Fast-forward main to upstream
        run: git merge --ff-only upstream/main

      - name: Push
        run: git push origin main

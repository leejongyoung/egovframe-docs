name: Check upstream PR head hygiene

# push 트리거는 "push된 브랜치 자신의 트리에 이 워크플로 파일이 있어야" 작동하기
# 때문에, hugo-project/main에서 새로 분기한 토픽 브랜치(.github/ 자체가 없음)에는
# 절대 적용될 수 없다. 그래서 push 시점 감지 대신 default 브랜치(work)에서
# 매일 도는 schedule로, 현재 열려있는 모든 업스트림 PR의 head가 여전히
# scripts/open_upstream_pr.sh가 만든 1회용 upstream-submit/* 스냅샷 브랜치인지
# 검사한다. PR #1151(head: fix/hugo-project-maintenance)처럼 개발 브랜치를
# 그대로 PR head로 쓴 경우를 매일 다시 잡아낸다.
on:
  schedule:
    - cron: '45 15 * * *'  # 매일 UTC 15:45 (KST 00:45)
  workflow_dispatch:

jobs:
  check:
    if: github.repository == 'leejongyoung/egovframe-docs'
    runs-on: ubuntu-latest
    steps:
      - name: Flag upstream PRs not using a disposable submission branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo eGovFramework/egovframe-docs --author leejongyoung \
            --state open --json number,headRefName,url)"

          bad="$(echo "$prs" | jq -r '.[] | select(.headRefName | startswith("upstream-submit/") | not) |
            "#\(.number) (head: \(.headRefName)) \(.url)"')"

          if [ -n "$bad" ]; then
            echo "::error::다음 열린 업스트림 PR은 head가 1회용 upstream-submit/* 스냅샷 브랜치가 아닙니다."
            echo "::error::개발을 계속하는 브랜치를 그대로 쓰고 있다면, 거기 다시 커밋을 푸시하면 이 PR이 조용히 갱신됩니다."
            echo "$bad"
            echo
            echo "이미 알고 있고 더 이상 그 브랜치에 커밋하지 않기로 했다면 이 실패는 무시해도 됩니다 -"
            echo "이 워크플로는 '위험이 아직 남아있다'는 걸 매일 다시 알려주는 용도입니다."
            exit 1
          fi

          echo "모든 열린 업스트림 PR이 upstream-submit/* 스냅샷 브랜치를 사용 중입니다."

name: Sync fork mirrors with upstream

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 UTC 15:00 (KST 00:00)
  workflow_dispatch:

concurrency:
  group: sync-upstream-mirrors
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'leejongyoung/egovframe-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        branch: [main, hugo-project]
      fail-fast: false
    steps:
      - name: Check out fork ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream ${{ matrix.branch }}
        run: |
          git remote add upstream https://github.com/eGovFramework/egovframe-docs.git
          git fetch upstream ${{ matrix.branch }}

      # main과 hugo-project는 어떤 직접 커밋도 받지 않는 순수 미러이므로
      # fast-forward만 허용한다. 둘 중 하나에 수동 커밋이 생겨 fast-forward가
      # 불가능해지면 그 브랜치만 여기서 실패해 알려준다(matrix: fail-fast 끔).
      - name: Fast-forward ${{ matrix.branch }} to upstream
        run: git merge --ff-only upstream/${{ matrix.branch }}

      - name: Push
        run: git push origin ${{ matrix.branch }}
